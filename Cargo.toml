[package]
name = "datafusion-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "55"
parquet = {version = "55", features = ["arrow"]}
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
datafusion = "55.0.0"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
